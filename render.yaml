# Render Blueprint: one web service built from the Dockerfile. 0.5c-512mb is
# the $7/month plan: unlike free, it does not spin down when idle.
# In Render: New → Blueprint → pick this repository.  Every push to the
# linked branch redeploys.  Pick the region nearest the display; it cannot change later.
services:
  - type: web
    name: cardio-twin
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: CARDIOTWIN_ECHO_LOG
        value: "0"

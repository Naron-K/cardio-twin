# Render Blueprint: one web service built from the Dockerfile. 0.5c-512mb is
# the $7/month plan: unlike free, it does not spin down when idle.
# In Render: New → Blueprint → pick this repository.  Every push to the
# linked branch redeploys.  Pick the region nearest the display; it cannot change later.
services:
  - type: web
    name: cardio-twin
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: CARDIOTWIN_ECHO_LOG
        value: "0"
      # Streams stop by themselves at this many GB in a UTC month, a little under
      # the 5 GB the workspace includes. Each GB above 5 costs $0.15.
      - key: CARDIOTWIN_MONTHLY_GB
        value: "4.5"
      # Send every 5th snapshot: 2 a second, about 53 MB an hour per open page
      # instead of 264. The model still runs every cycle.
      - key: CARDIOTWIN_EMIT_EVERY
        value: "5"

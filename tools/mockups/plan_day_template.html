<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan a day mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Hanken+Grotesk:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script>window.PLAN_DATA = /*DATA*/;</script>
<script id="model">
(function () {
  'use strict';
  function finite(v) { return typeof v === 'number' && Number.isFinite(v); }
  function need(v, field) {
    if (!finite(v)) throw new Error(field + ' must be a finite number, got ' + String(v));
  }
  function findKind(id, data) {
    var k = (data.kinds || []).find(function (x) { return x.id === id; });
    if (!k) throw new Error('kind: unknown kind "' + id + '"');
    return k;
  }
  globalThis.projectDay = function (plan, data) {
    if (!plan || typeof plan !== 'object') throw new Error('plan must be an object');
    if (!Array.isArray(plan.awake) || plan.awake.length !== 2) throw new Error('plan.awake must be [start, end]');
    var a0 = plan.awake[0], a1 = plan.awake[1], i, m, j;
    need(a0, 'plan.awake[0]');
    need(a1, 'plan.awake[1]');
    need(plan.t_app, 'plan.t_app');
    need(plan.level, 'plan.level');
    need(plan.steps_outside, 'plan.steps_outside');
    if (a1 <= a0) throw new Error('plan.awake must have start < end, got [' + a0 + ', ' + a1 + ')');
    var sessions = plan.sessions || [];
    if (!Array.isArray(sessions)) throw new Error('plan.sessions must be an array, got ' + String(sessions));
    var seen = [];
    for (i = 0; i < sessions.length; i++) {
      var se = sessions[i] || {};
      var kind = findKind(se.kind, data);
      need(se.start, 'session ' + (i + 1) + ' start');
      need(se.minutes, 'session ' + (i + 1) + ' minutes');
      need(se.intensity, 'session ' + (i + 1) + ' intensity');
      need(se.steps, 'session ' + (i + 1) + ' steps');
      if (se.minutes < 1) throw new Error('session ' + (i + 1) + ' minutes must be at least 1, got ' + se.minutes);
      var end = se.start + se.minutes;
      if (end <= a0 || end > a1) throw new Error('session ' + (i + 1) + ' is outside the awake window [' + a0 + ', ' + a1 + '): start ' + se.start + ', minutes ' + se.minutes);
      for (j = 0; j < seen.length; j++) {
        var o = seen[j];
        if (se.start < o.end && o.start < end) throw new Error('session ' + (i + 1) + ' [' + se.start + ', ' + end + ') overlaps session ' + (j + 1) + ' [' + o.start + ', ' + o.end + ')');
      }
      seen.push({ start: se.start, end: end, kind: kind.id });
    }
    var N = 1440;
    var hr = new Array(N).fill(null), target = new Array(N).fill(null), ae = new Array(N).fill(null);
    var steps = new Array(N).fill(0), group = new Array(N).fill(null);
    var inSession = new Array(N).fill(false);
    for (i = 0; i < sessions.length; i++) {
      var s = sessions[i];
      for (m = s.start; m < s.start + s.minutes; m++) {
        if (m < 0 || m >= N) continue;
        ae[m] = s.intensity;
        steps[m] = s.steps / s.minutes;
        group[m] = s.kind;
        inSession[m] = true;
      }
    }
    var outside = [];
    for (m = a0; m < a1 && m < N; m++) if (!inSession[m]) outside.push(m);
    var W = 0;
    for (i = 0; i < outside.length; i++) W += data.hourly.steps[Math.floor(outside[i] / 60)];
    for (i = 0; i < outside.length; i++) {
      m = outside[i];
      ae[m] = data.hourly.ae[Math.floor(m / 60)];
      if (W > 0) steps[m] = plan.steps_outside * data.hourly.steps[Math.floor(m / 60)] / W;
      else steps[m] = plan.steps_outside / outside.length;
    }
    var c = data.coef, prev = null;
    for (m = 0; m < N; m++) {
      if (ae[m] === null) { target[m] = null; hr[m] = null; prev = null; continue; }
      var h = m / 60;
      var g = group[m] ? c['g_' + group[m]] : 1;
      var total = plan.level + c.HR_offset + c.A_circ * Math.cos(2 * Math.PI * (h - c.phi_circ) / 24)
        + c.k_T * Math.max(0, plan.t_app - c.T_ref) + c.k_I * g * Math.pow(ae[m], c.p_I);
      target[m] = Math.min(c.HR_max, Math.max(data.hr_floor, total));
      if (prev === null) hr[m] = target[m];
      else {
        var tau = target[m] > prev ? c.tau_on : c.tau_off;
        hr[m] = tau === 0 ? target[m] : prev + (1 - Math.exp(-60 / tau)) * (target[m] - prev);
      }
      prev = hr[m];
    }
    return { hr: hr, target: target, ae: ae, steps: steps, group: group };
  };
  globalThis.settleTarget = function (kindId, intensity, hour, plan, data) {
    findKind(kindId, data);
    var c = data.coef, g = c['g_' + kindId];
    var total = plan.level + c.HR_offset + c.A_circ * Math.cos(2 * Math.PI * (hour - c.phi_circ) / 24)
      + c.k_T * Math.max(0, plan.t_app - c.T_ref) + c.k_I * g * Math.pow(intensity, c.p_I);
    return Math.min(c.HR_max, Math.max(data.hr_floor, total));
  };
  globalThis.intensityForTarget = function (kindId, targetBpm, hour, plan, data) {
    var k = findKind(kindId, data);
    var lo = k.ae.p10, hi = k.ae.p90;
    var flo = globalThis.settleTarget(kindId, lo, hour, plan, data);
    var fhi = globalThis.settleTarget(kindId, hi, hour, plan, data);
    if (targetBpm <= flo) return lo;
    if (targetBpm >= fhi) return hi;
    for (var i = 0; i < 60; i++) {
      var mid = (lo + hi) / 2;
      if (globalThis.settleTarget(kindId, mid, hour, plan, data) < targetBpm) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  };
})();
</script>
<style>
:root{--bg:#081425;--card:#111c2d;--card2:#152031;--line:rgba(216,227,251,.14);--ink:#d8e3fb;--ink2:rgba(216,227,251,.72);--ink3:rgba(216,227,251,.52);

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hanken Grotesk",system-ui,sans-serif}

.tabs{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

.colrow{display:flex;gap:16px;overflow-x:auto;padding-bottom:6px;align-items:stretch}

input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:44px;margin:0;background:transparent;cursor:pointer}

#add{min-height:52px;width:100%;font-size:16px}
.timeline{margin-top:14px}
.timeline svg, #hrchart svg, .strip svg{display:block;width:100%;height:auto}
svg text{font:13px "JetBrains Mono",monospace;fill:var(--ink2)}
svg text.t{font:600 13px "Hanken Grotesk",sans-serif;fill:var(--ink)}
.timeline svg text.tl{font:600 13px "Hanken Grotesk",sans-serif;fill:#04202a}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
#run{min-height:52px;min-width:130px;font-size:16px}
#status{font:13px "JetBrains Mono",monospace;color:var(--ink2)}
.resultwrap{position:relative;margin-top:16px}
.two{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(360px,1fr);gap:16px}
.two.dim{opacity:.35;pointer-events:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,20,37,.35);border-radius:14px;z-index:5}
.overlay button{min-height:52px;font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink2);font-size:13px;margin:4px 0 6px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.legend i.dash{border-top-style:dashed}
.legend i.box{height:12px;border:0;border-radius:3px;vertical-align:-1px}
.legend i.hatch{height:12px;border:1px solid var(--line);border-radius:3px;vertical-align:-1px;background:repeating-linear-gradient(45deg,transparent 0 3px,var(--line) 3px 5px)}
.strip{margin-top:8px}
.playrow{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin-top:12px}
.speeds{display:flex;gap:6px;flex-wrap:wrap}
.speeds button{font-family:"JetBrains Mono",monospace;padding:0 12px}
#jump{flex:1 1 180px;min-width:140px}
#readout{flex:1 0 100%;font:13px "JetBrains Mono",monospace;color:var(--ink2);min-height:20px}
.banner{border:1px solid var(--warn);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:var(--ink2);font-size:13px;margin-bottom:12px}
.banner button{min-height:44px}
#limits ul{margin:0 0 14px;padding-left:20px;color:var(--ink2);font-size:13px}
#limits li{margin:3px 0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.kpi{background:var(--card2);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:700 24px "JetBrains Mono",monospace;line-height:1.2}
.kpi span{color:var(--ink2);font-size:13px}
.kpi small{display:block;color:var(--ink3);font-size:13px}
.sesslist{display:grid;gap:10px}
.sess{display:block;width:100%;min-height:64px;text-align:left;background:var(--card2);border:1px solid var(--line);border-left:5px solid var(--other);border-radius:12px;padding:12px 14px;color:var(--ink);font-weight:400;font-size:15px}
.sess h3{font-size:15px;margin:0 0 6px}
.sess dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0}
.sess dt{color:var(--ink2);font-size:13px}
.sess dd{margin:0;font:700 13px "JetBrains Mono",monospace;text-align:right}
:focus-visible{outline:2px solid var(--model);outline-offset:2px}
[hidden]{display:none!important}
@media(max-width:1099.98px){.two{grid-template-columns:1fr}}
@media(max-width:759.98px){
  .wrap{padding:24px}
  .colrow{flex-direction:column;overflow-x:visible}
  .col,.addcol{flex:1 1 auto;width:100%}
  .grid2{grid-template-columns:1fr}
  .tabs{margin-left:0}
  #jump{flex:1 0 100%;width:100%;min-width:0}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Plan a day</h1>
  <span class="chip" id="subject"></span>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" aria-selected="true">Plan a day</button>
    <a class="tab" role="tab" aria-selected="false" href="day-view-demo.html?opt=C">Recorded days</a>
  </nav>
</header>
<p class="tinynote">Mockup for review · the model runs in this page</p>

<section class="card">
  <h2>Setup</h2>
  <div class="colrow" id="colrow"></div>
  <div class="timeline" id="timeline"></div>
  <div class="actions">
    <button class="primary" id="run">Run</button>
    <button id="reset">Reset to a typical day</button>
    <span id="status" role="status">Not run</span>
  </div>
</section>

<section class="resultwrap">
  <div class="two" id="results">
    <div class="card">
      <h2>Heart rate · projection</h2>
      <div class="legend" id="legend"></div>
      <div id="hrchart"></div>
      <div class="strip" id="energybar"></div>
      <div class="strip" id="stepsbar"></div>
      <div class="playrow">
        <button id="play" disabled>Play</button>
        <div class="speeds" role="group" aria-label="Playback speed">
          <button data-speed="60" aria-pressed="false">×60</button>
          <button data-speed="600" aria-pressed="true">×600</button>
          <button data-speed="3600" aria-pressed="false">×3600</button>
        </div>
        <input type="range" id="jump" min="0" max="1440" step="1" value="0" aria-label="Jump to minute">
        <div id="readout"></div>
      </div>
    </div>
    <div class="card">
      <div class="banner"><span id="banner"></span><button id="limitsbtn" aria-expanded="false" aria-controls="limits">Limits</button></div>
      <div id="limits" hidden></div>
      <div class="kpis" id="kpis"></div>
      <h2>Session results</h2>
      <div class="sesslist" id="sesslist"></div>
    </div>
  </div>
  <div class="overlay" id="overlay" hidden><button class="primary" id="again">Run again</button></div>
</section>
</div>
<script>
const D = window.PLAN_DATA;
const $ = (id) => document.getElementById(id);
const KIND = Object.fromEntries(D.kinds.map((k) => [k.id, k]));
const hhmm = (m) => { m = Math.round(m); const h = Math.floor(m / 60) % 24; const mi = ((m % 60) + 60) % 60; return String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0'); };
const axisTime = (m) => (m >= 1440 ? '24:00' : hhmm(m));
const num = (v) => Math.round(v).toLocaleString('en-GB');
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const labelOf = (id) => (KIND[id] ? KIND[id].label : id);

const DEF = JSON.parse(JSON.stringify(D.default_plan));
function fromPlan(p) {
  return {
    awake: [p.awake[0], p.awake[1]], tApp: p.t_app, level: p.level, stepsOutside: p.steps_outside,
    sessions: p.sessions.map((s) => ({ kind: s.kind, start: s.start, minutes: s.minutes, intensity: s.intensity, steps: s.steps, touched: false, target: null, msgStart: '', msgLen: '' }))
  };
}
let S = fromPlan(DEF);
let ui = { m0: '', m1: '' };
let run = null, stale = false, playing = false, cursor = 0, speed = 600, raf = 0, last = 0, lastDrawn = -1;

function planNow() {
  return { awake: [S.awake[0], S.awake[1]], t_app: S.tApp, level: S.level, steps_outside: S.stepsOutside,
    sessions: S.sessions.map((s) => ({ kind: s.kind, start: s.start, minutes: s.minutes, intensity: s.intensity, steps: s.steps })) };
}
function firstIndex() { let r = -1; S.sessions.forEach((s, i) => { if (r < 0 || s.start < S.sessions[r].start) r = i; }); return r; }
function lastIndex() { let r = -1; S.sessions.forEach((s, i) => { const e = s.start + s.minutes; if (r < 0 || e > S.sessions[r].start + S.sessions[r].minutes) r = i; }); return r; }
function overlaps(i, start, minutes) {
  for (let j = 0; j < S.sessions.length; j++) {
    if (j === i) continue;
    const o = S.sessions[j];
    if (start < o.start + o.minutes && o.start < start + minutes) return j;
  }
  return -1;
}
function firstFit(minutes) {
  for (let c = S.awake[0]; c + minutes <= S.awake[1]; c += 5) {
    let ok = true;
    for (const s of S.sessions) if (c < s.start + s.minutes && s.start < c + minutes) { ok = false; break; }
    if (ok) return c;
  }
  return null;
}
function settleHour(s) { return (s.start + s.minutes / 2) / 60; }
function targetRange(s) {
  const k = KIND[s.kind], p = planNow();
  const lo = Math.round(settleTarget(s.kind, k.ae.p10, settleHour(s), p, D));
  const hi = Math.round(settleTarget(s.kind, k.ae.p90, settleHour(s), p, D));
  return [lo, Math.max(lo + 1, hi)];
}
function targetValue(s) { return s.target != null ? s.target : Math.round(settleTarget(s.kind, s.intensity, settleHour(s), planNow(), D)); }
function clearMsgs() { ui.m0 = ''; ui.m1 = ''; S.sessions.forEach((s) => { s.msgStart = ''; s.msgLen = ''; }); }

function markDirty() {
  if (!run) return;
  stale = true; playing = false;
  if (raf) { cancelAnimationFrame(raf); raf = 0; }
  $('results').classList.add('dim');
  $('overlay').hidden = false;
  refreshStatus();
}
function refreshStatus() {
  const st = !run ? 'Not run' : stale ? 'Setup changed' : playing ? 'Playing ' + hhmm(cursor) + ' · ×' + speed : cursor >= run.plan.awake[1] ? 'Done' : 'Paused ' + hhmm(cursor);
  $('status').textContent = st;
  $('play').disabled = !run || stale;
  $('play').textContent = playing ? 'Pause' : 'Play';
  $('jump').disabled = !run || stale;
  if (run) { $('jump').min = run.plan.awake[0]; $('jump').max = run.plan.awake[1]; $('jump').value = Math.round(cursor); }
  document.querySelectorAll('[data-speed]').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.speed === speed));
}

// A slider with its label and value above it, an optional note directly under
// it (so the note reads as belonging to this slider, not the next one), and
// the status line a refused move writes into.
function rangeHTML(id, label, min, max, step, val, text, note) {
  return '<div class="ctrl"><div class="row"><label for="' + id + '">' + label + '</label><span class="val" id="' + id + 'v">' + text + '</span></div>' +
    '<input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '">' +
    (note ? '<p class="small mono">' + note + '</p>' : '') +
    '<div class="st" id="' + id + 's" role="status"></div></div>';
}
function dayHTML() {
  const d = D.day, rec = d.level.recorded;
  const stepMax = Math.round(d.steps_outside.p90 * 1.5 / 100) * 100;
  return '<div class="col"><div class="colhead"><h3>Day</h3></div><div class="grid2">' +
    rangeHTML('d-awake0', 'Awake from', 240, 720, 5, S.awake[0], hhmm(S.awake[0])) +

      if (proj.ae[m] != null) ke += proj.ae[m];
      st += proj.steps[m];
    }
    if (n) { mean = Math.round(sum / n) + ' bpm'; peak = Math.round(pk) + ' bpm'; }
    kcal = num(ke) + ' kcal'; steps = num(st);
  }
  return '<button class="sess" data-jump="' + s.start + '" style="border-left-color:var(--' + s.kind + ')">' +
    '<h3>' + KIND[s.kind].label + ' · ' + hhmm(s.start) + '–' + hhmm(s.start + s.minutes) + ' · ' + s.minutes + ' min</h3>' +
    '<dl><dt>Settles near</dt><dd>' + settle + ' bpm</dd><dt>Model mean</dt><dd>' + mean + '</dd><dt>Model peak</dt><dd>' + peak + '</dd>' +
    '<dt>Energy</dt><dd>' + kcal + '</dd><dt>Steps</dt><dd>' + steps + '</dd></dl></button>';
}

function tick(ts) {
  if (!playing || !run) return;
  if (!last) last = ts;
  let dt = (ts - last) / 1000; last = ts;
  if (dt > 0.5) dt = 0.5;
  const a1 = run.plan.awake[1];
  cursor += speed * dt / 60;
  if (cursor >= a1) { cursor = a1; playing = false; }
  const drawn = Math.floor(cursor);
  if (drawn !== lastDrawn) { lastDrawn = drawn; drawCharts(); readout(); }
  refreshStatus();
  if (!playing) { raf = 0; last = 0; return; }
  raf = requestAnimationFrame(tick);
}
function doRun() {
  let proj;
  try { proj = projectDay(planNow(), D); } catch (err) { console.error(err); return; }
  run = { plan: JSON.parse(JSON.stringify(planNow())), proj: proj };
  stale = false; playing = true; cursor = run.plan.awake[0]; last = 0; lastDrawn = -1;
  if (raf) { cancelAnimationFrame(raf); raf = 0; }
  $('results').classList.remove('dim'); $('overlay').hidden = true;
  renderSide(); drawCharts(); readout(); refreshStatus();
  if (run.plan.awake[0] >= run.plan.awake[1]) { playing = false; refreshStatus(); return; }
  raf = requestAnimationFrame(tick);
}
function resetDay() {
  if (run) markDirty();
  S = fromPlan(DEF); ui = { m0: '', m1: '' }; playing = false; lastDrawn = -1;
  if (raf) { cancelAnimationFrame(raf); raf = 0; }
  renderSetup(); renderSide(); readout(); refreshStatus();
}

$('subject').textContent = D.subject_label;
$('banner').textContent = 'Projection from a plan · ' + D.subject_label + "'s model · not measured";
$('legend').innerHTML = '<span><i class="dash" style="border-color:var(--model)"></i>Model projection</span>' +
  '<span><i class="box" style="background:var(--band)"></i>± ' + D.error.hr_mae + ' bpm usual error</span>' +
  D.kinds.map((k) => '<span><i class="box" style="background:var(--' + k.id + ')"></i>' + k.label + '</span>').join('') +
  '<span><i class="hatch"></i>No projection</span>';
$('limits').innerHTML = '<ul>' +
  '<li>' + D.applies_to + '</li>' +
  '<li>Session peaks ' + D.error.peak_low[0] + '–' + D.error.peak_low[1] + ' bpm too low on test sessions</li>' +
  '<li>Steps outside sessions: as set</li>' +
  '<li>No fatigue, recovery, sleep or night</li>' +
  '<li>Tested on ' + D.error.test_days + ' days, ' + D.error.test_sessions + ' sessions: energy ± ' + D.error.kcal_mae + ' kcal/day, heart rate ± ' + D.error.hr_mae + ' bpm/min</li></ul>';
$('limitsbtn').onclick = () => {
  const open = $('limits').hidden;
  $('limits').hidden = !open;
  $('limitsbtn').setAttribute('aria-expanded', String(open));
};
$('run').onclick = doRun;
$('again').onclick = doRun;
$('reset').onclick = resetDay;
$('play').onclick = () => {
  if (!run || stale) return;
  if (playing) { playing = false; if (raf) { cancelAnimationFrame(raf); raf = 0; } readout(); refreshStatus(); return; }
  if (cursor >= run.plan.awake[1]) { cursor = run.plan.awake[0]; lastDrawn = -1; drawCharts(); readout(); }
  playing = true; last = 0; refreshStatus(); raf = requestAnimationFrame(tick);
};
document.querySelectorAll('[data-speed]').forEach((b) => {
  b.onclick = () => { speed = +b.dataset.speed; refreshStatus(); };
});
$('jump').oninput = (e) => {
  if (!run || stale) return;
  cursor = clamp(+e.target.value, run.plan.awake[0], run.plan.awake[1]);
  lastDrawn = -1; drawCharts(); readout(); refreshStatus();
};
let rt = 0;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { drawTimeline(); drawCharts(); }, 100); });

renderSetup();
renderSide();
drawCharts();
readout();
refreshStatus();

D.check.forEach((c) => {
  let worst = 0;
  try {
    const o = projectDay(c.plan, D);
    for (let m = 0; m < 1440; m++) {
      const a = o.hr[m], b = c.hr[m];
      if ((a === null) !== (b === null)) { worst = Infinity; break; }
      if (a !== null) worst = Math.max(worst, Math.abs(a - b));
    }
  } catch (err) { console.error(err); worst = Infinity; }
  console.log('parity max |Δ| =', worst);
});
</script>
</body>
</html>
